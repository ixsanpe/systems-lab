[project]
name = "kafka-airline"
version = "0.1.0"
description = "Learning Kafka through airline operations events"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
