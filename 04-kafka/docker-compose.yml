# 3-broker Kafka cluster in KRaft mode (no ZooKeeper: metadata lives in an
# internal Raft quorum formed by the controllers). Each node is both broker
# and controller ("combined mode") to keep the laptop footprint small.
#
# From your host, bootstrap with: localhost:29092,localhost:39092,localhost:49092
# Inside the docker network:      kafka-1:19092,kafka-2:19092,kafka-3:19092

x-kafka-env: &kafka-env
  CLUSTER_ID: "kafka-airline-lab-0001"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  # Cluster-wide defaults used by the exercises (acks=all needs >= 2 in-sync replicas)
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Small segments + frequent cleaner checks so compaction/retention are observable in minutes
  KAFKA_LOG_SEGMENT_BYTES: 1048576
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 10000
  KAFKA_LOG_CLEANER_BACKOFF_MS: 5000
  KAFKA_LOG_DIRS: /var/lib/kafka/data

services:
  kafka-1:
    image: apache/kafka:4.1.0
    container_name: kafka-1
    ports: ["29092:29092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:29092

  kafka-2:
    image: apache/kafka:4.1.0
    container_name: kafka-2
    ports: ["39092:39092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:39092

  kafka-3:
    image: apache/kafka:4.1.0
    container_name: kafka-3
    ports: ["49092:49092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:49092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:49092

  # Optional web UI: http://localhost:8080  (start with `just ui`)
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: kafka-ui
    profiles: ["ui"]
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: airline-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    depends_on: [kafka-1, kafka-2, kafka-3]
